# Clock: 16 MHz crystal (Y1) across XTAL1/XTAL2 on the Storage Card Pro
#   CKSEL3:1 = 111   -> low power crystal oscillator, 8.0-16.0 MHz
#   CKSEL0   = 1     -> crystal (not ceramic resonator)
#   SUT1:0   = 11    -> slowly rising power, 16K CK + 65 ms
#   CKDIV8   = 1     -> no clock division (full 16 MHz)
#   CKOUT    = 1     -> clock output disabled
# Lock bits are left unprogrammed. The upload command does not pass --lock, so
# this value is never written; it records the erased state for reference only.
lfuse = 0xFF
hfuse = 0xFF
efuse = 0xFF
lock = 0xFF
